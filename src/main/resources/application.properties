spring.application.name=user-manager
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${URI_DB}
spring.datasource.username=${USER_DB}
spring.datasource.password=${PASSWORD_DB}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
user.manager.service.recipeFrontUrl=${FRONT_URL}
jwt.secret=${JWT_SECRET:my-secret-key-which-should-be-very-long-and-secure}
centauro.security.permissions.enforce=${PERMISSIONS_ENFORCE:false}
# Trial de billing al crear una empresa (registro o alta desde la plataforma). Sin BILLING_URL o
# BILLING_INTERNAL_API_KEY, o con duraciones invalidas, la integracion queda deshabilitada (WARN al arrancar).
# No hay conciliacion automatica: si se agotan los reintentos se loguea ERROR y el trial se crea desde el backoffice.
# No activar DEBUG de org.springframework.web.client en produccion: loguea el body, que incluye el email.
billing.url=${BILLING_URL:}
billing.internal-api-key=${BILLING_INTERNAL_API_KEY:}
billing.trial.enabled=${BILLING_TRIAL_ENABLED:true}
billing.connect-timeout=${BILLING_CONNECT_TIMEOUT:3s}
billing.read-timeout=${BILLING_READ_TIMEOUT:5s}
billing.trial.retry-backoff=${BILLING_TRIAL_RETRY_BACKOFF:2s,10s,30s}
billing.trial.shutdown-timeout=${BILLING_TRIAL_SHUTDOWN_TIMEOUT:10s}
